services:

  wallet-instance:
    image: ghcr.io/italia/iam-proxy-italia-wallet-instance-demo:1.0.2
    container_name: iam-proxy-italia-wallet-instance-demo
    environment:
      - FLASK_RUN_PORT=8080
      - PYTHONUNBUFFERED=1
      - CONFIG_DIR=/application/config
      - POETRY_VERSION=2.3.2
      - TZ=Europe/Rome
    ports:
      - "8080:8080"
    volumes:
      - ./config:/application/config:ro
    restart: unless-stopped

networks:
  iam-proxy-italia:
    name: iam-proxy-italia
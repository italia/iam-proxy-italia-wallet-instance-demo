<!-- Stylized Tessera Sanitaria card front (SVG replacement for photo). Illustration only, not an official document. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none" role="img" aria-label="Tessera Sanitaria">
  <rect width="400" height="250" fill="#f5f5f0"/>
  <!-- Italian flag stripes (vertical, left side) -->
  <rect x="0"   y="0" width="80" height="250" fill="#009246"/>
  <rect x="80"  y="0" width="80" height="250" fill="#fff"/>
  <rect x="160" y="0" width="80" height="250" fill="#CE2B37"/>
  <!-- Chip area -->
  <rect x="260" y="20" width="60" height="45" rx="4" fill="#d4af37" opacity="0.6"/>
  <rect x="268" y="28" width="44" height="29" rx="2" fill="#333"/>
  <!-- Card outline -->
  <rect x="2" y="2" width="396" height="246" rx="4" fill="none" stroke="#ccc" stroke-width="1"/>
</svg>

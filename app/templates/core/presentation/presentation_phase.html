<div class="modal fade" id="presentation-modal" tabindex="-1" role="dialog" aria-labelledby="presentationModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title w-100 text-center" id="presentationModalTitle">{{ _('Conferma presentazione') }}</h5>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="{{ _('Chiudi') }}" onclick="chiudiPresentationPopup()"></button>
      </div>
      <div class="modal-body">
        <div id="presentation-warning" class="alert alert-warning d-none" role="status"></div>
        <section class="presentation-section">
          <h6>{{ _('Verificatore') }}</h6>
          <div id="presentation-rp" class="presentation-rp presentation-fields"></div>
        </section>
        <section class="presentation-section">
          <h6>{{ _('Attestazioni richieste') }}</h6>
          <div id="presentation-credentials" class="presentation-fields"></div>
        </section>
      </div>
      <div class="modal-footer justify-content-center">
        <button id="presentation-confirm" class="btn btn-primary btn-sm" type="button" data-bs-dismiss="modal" onclick="authorizationProcess()">{{ _('Conferma') }}</button>
        <button id="presentation-continue" class="btn btn-primary btn-sm d-none" type="button" data-bs-dismiss="modal" onclick="authorizationProcess()">{{ _('Presenta comunque') }}</button>
        <button id="presentation-reissue" class="btn btn-outline-primary btn-sm d-none" type="button" data-bs-dismiss="modal" onclick="requestNewIssuance()">{{ _('Richiedi una nuova emissione') }}</button>
        <button class="btn btn-secondary btn-sm" type="button" data-bs-dismiss="modal" onclick="chiudiPresentationPopup()">{{ _('Annulla') }}</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="presentation-result-modal" tabindex="-1" role="dialog" aria-labelledby="presentationResultModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title w-100 text-center" id="presentationResultModalTitle">{{ _('Esito accesso') }}</h5>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="{{ _('Chiudi') }}"></button>
      </div>
      <div class="modal-body text-center">
        <p id="presentation-result-message" class="mt-3 mb-0"></p>
      </div>
      <div class="modal-footer justify-content-center">
        <button class="btn btn-primary btn-sm" type="button" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

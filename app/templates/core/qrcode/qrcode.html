<div class="modal fade" id="qr-scanner-modal" tabindex="-1" role="dialog" aria-labelledby="qrModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title w-100 text-center" id="qrModalTitle">{{ _('Inquadra, cattura o carica il QR Code') }}</h5>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="{{ _('Chiudi') }}" onclick="stopQrScanner()"></button>
      </div>
      <div class="modal-body text-center">
        <div id="qr-stage">
          <video id="qr-video" style="display: none;"></video>
          <canvas id="qr-canvas"></canvas>
          <div id="qr-selection" hidden></div>
        </div>

        <p id="qr-hint" class="mt-3 text-muted">{{ _('Inquadra il QR Code oppure:') }}</p>

        <div class="qr-source-actions">
          <input type="file" id="qr-file-input" accept="image/*" style="display: none;" onchange="handleQrFileUpload(event)" />
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('qr-file-input').click()">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/static/svg/sprites.svg#it-upload"></use></svg>
            {{ _("Carica un'immagine QR") }}
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="startScreenPortion()">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/static/svg/sprites.svg#it-fullscreen"></use></svg>
            {{ _('Inquadra una porzione dello schermo') }}
          </button>
        </div>
      </div>
      <div class="modal-footer justify-content-center">
        <button class="btn btn-secondary btn-sm" type="button" data-bs-dismiss="modal" onclick="stopQrScanner()">{{ _('Annulla') }}</button>
      </div>
    </div>
  </div>
</div>

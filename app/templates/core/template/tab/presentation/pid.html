<!-- htmlhint doctype-first:false -->
<form>
  <div class="row">
    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Nome:') }} {{ internal_claims.given_name }}</label>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Cognome:') }} {{ internal_claims.family_name }}</label>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Data di nascita:') }} {{ internal_claims.birthdate }}</label>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Luogo di nascita:') }} {{ internal_claims.place_of_birth.locality }}</label>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Nazionalità:') }} {{ internal_claims.nationalities | join(', ') }}</label>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Codice fiscale:') }} {{ internal_claims.tax_id_code }}</label>
      </div>
    </div>
  </div>
  <hr>

  <div class="row">
    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Paese emittente:') }} {{ internal_claims.issuing_country }}</label>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Autorità emittente:') }} {{ internal_claims.issuing_authority }}</label>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Data di emissione:') }} {{ internal_claims.issuance_date | format_date }}</label>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="form-group">
        <label>{{ _('Data di scadenza:') }} {{ internal_claims.date_of_expiry | format_date }}</label>
      </div>
    </div>
  </div>

  {% if metadata %}
  <div class="row">
    <div class="col-12">
      <div class="alert alert-info" role="alert">
     <strong>{{ _('Dettagli aggiuntivi') }}</strong><br>
      {% if metadata is mapping %}
        <div class="d-flex flex-wrap gap-2 small">
          {% for key, value in metadata.items() %}
          <span><span class="fw-semibold">{{ key }}:</span> <span class="text-muted">{{ value }}</span></span>
          {% endfor %}
        </div>
      {% else %}
        {{ metadata }}
      {% endif %}
      </div>
    </div>
  </div>
  {% endif %}
</form>

<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>{{ _('Completato') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <p>{{ _('Accesso completato. Torno al wallet per salvare l\'attestazione.') }}</p>
  <script>
    if (window.opener) {
      window.opener.postMessage({ event: "wallet_flow_complete" }, window.location.origin);
      setTimeout(() => window.close(), 500);
    } else {
      window.location.replace("/wallet/home?issued=1");
    }
  </script>
</body>
</html>

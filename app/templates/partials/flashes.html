{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      {% if category == 'success' %}
        <div class="alert alert-success" role="status">{{ message }}</div>
      {% elif category == 'error' %}
        <div class="alert alert-danger" role="alert"><strong>{{ _('Errore:') }}</strong> {{ message }}</div>
      {% endif %}
    {% endfor %}
  {% endif %}
{% endwith %}

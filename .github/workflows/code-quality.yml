# Code quality, complexity, and Python linting
# - Ruff: fast Python linter and formatter
# - Radon: cyclomatic complexity and maintainability index
name: Code quality & linting

on:
  push:
  pull_request:

jobs:
  lint:
    name: Python lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  complexity:
    name: Code complexity (Radon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Radon
        run: pip install radon

      - name: Cyclomatic complexity (CC)
        run: |
          radon cc app.py routes/ service/ utils/ state.py constants.py -a -s --total-average
        continue-on-error: true

      - name: Maintainability index (MI)
        run: |
          radon mi app.py routes/ service/ utils/ state.py constants.py -s -n B
        continue-on-error: true

      - name: Fail on high complexity (Xenon)
        run: |
          pip install xenon
          xenon --max-absolute B --max-modules B --max-average A app.py routes/ service/ utils/

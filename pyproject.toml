[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = []

[project]
name = "iam-proxy-italia-wallet-instance-demo"
version = "1.3.3"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "beautifulsoup4==4.14.3",
    "cbor2==5.9.0",
    "cryptography==46.0.5",
    "PyMuPDF==1.27.2",
    "cryptojwt==1.9.4",
    "Flask==3.1.3",
    "jmespath==1.1.0",
    "jwcrypto==1.5.6",
    "pillow==12.1.1",
    "pydantic==2.12.5",
    "PyJWT==2.12.1",
    "bcrypt==5.0.0",
    "pyzbar==0.1.9",
    "requests==2.32.5",
    "urllib3==2.6.3",
    "pyeudiw @ git+https://github.com/italia/eudi-wallet-it-python@dev"
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".ci_env", ".ci-venv", ".git", "__pycache__", ".venv", "venv", "app/static", "app/templates", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.radon]
min = "B"

[tool.xenon]
max_absolute = "B"
max_modules = "B"
max_average = "A"

[tool.bandit]
exclude_dirs = [".ci_env", ".ci-venv", ".git", "__pycache__", ".venv", "venv", "app/static", "app/templates"]
skips = [
    "B101",  # assert_used
    "B104",  # hardcoded_bind_all_interfaces - demo dev server
    "B201",  # flask_debug_true - dev/demo
    "B501",  # request verify=False - proxy/dev config
    "B113",  # request_without_timeout - existing pattern
]
